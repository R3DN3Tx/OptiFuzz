# Differences from the vendored dirsearch/config.ini: `default-extensions` blank (below) and `skip-on-status` blank.
# `skip-on-status = 429` is dirsearch's own default: at the first 429 it silently ENDS the whole scan (before printing
# that response) and exits 0, so OptiFuzz's auto-pause on 429/503 could never see it -- a real, reported job
# "completed" at ~4% of its wordlist. Blank, a 429 is printed like any other result and the job pauses/resumes.
# optifuzz_dirsearch_config_default_ext.ini is this same file with dirsearch's own default-extensions kept.
#
# OptiFuzz's own dirsearch config override -- passed via the DIRSEARCH_CONFIG
# env var (see DirsearchEngine.build_command's own comment for the full
# story), NOT the vendored dirsearch/config.ini this is copied from. Every
# value here is identical to that vendored file's own shipped defaults,
# EXCEPT `default-extensions` below, deliberately blanked out -- the one
# real, reported bug this file exists to fix.
#
# Real, reported bug: dirsearch's own options.py does
# `opt.extensions = opt.extensions or config.safe_get("dictionary",
# "default-extensions", "")` -- if OptiFuzz's own -e flag is never passed at
# all (the user picked no extensions), dirsearch silently falls back to
# config.ini's own "php,asp,aspx,jsp,html,htm" instead of genuinely "no
# extensions". Combined with Force extensions (-f), this silently multiplied
# every eligible wordlist line into 8 real requests (line, line/, plus 6
# extensions the user never chose and OptiFuzz's own UI has no way to show
# were ever in play) instead of the 2 (line, line/) a user picking "Force
# extensions" with an empty extensions field would reasonably expect --
# confirmed directly against a real run. Passing `-e ""` explicitly does NOT
# fix this: that options.py line uses Python's `or`, so an empty STRING is
# just as falsy as never passing the flag at all, and still triggers the
# same config fallback. Overriding the config value itself, via this
# separate file (never touching the vendored package's own config.ini,
# which a dirsearch upgrade could overwrite or reset), is the only clean fix
# that doesn't also require dirsearch source changes.

[general]
threads = 25
async = True
recursive = False
deep-recursive = False
force-recursive = False
recursion-status = 200-399,401,403
max-recursion-depth = 0
exclude-subdirs = %%ff/,.;/,..;/,;/,./,../,%%2e/,%%2e%%2e/
random-user-agents = False
max-time = 0
target-max-time = 0
exit-on-error = False
skip-on-status =
auto-calibration = False

[advanced-filtering]
matcher-mode = or
filter-mode = or

[dictionary]
default-extensions =
force-extensions = False
overwrite-extensions = False
lowercase = False
uppercase = False
capital = False
wordlist-backend = auto
wordlist-max-size = 500000

[request]
http-method = get
request-backend = python
follow-redirects = False

[connection]
timeout = 7.5
delay = 0
max-rate = 0
max-retries = 1

[advanced]
crawl = False
find-backup = False

[view]
full-url = False
quiet-mode = False
color = True
show-redirects-history = False
disable-cli = False
verbose = False

[output]
output-formats = plain
output-sql-table = {scheme}_{host}:{port}
